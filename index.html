      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "dark" || (!t && !window.matchMedia("(prefers-color-scheme: light)").matches)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
